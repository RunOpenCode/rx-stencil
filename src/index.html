<!DOCTYPE html>
<html dir="ltr" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
        <title>@runopencode/rx-stencil</title>

        <script type="module" src="/build/rx-stencil.esm.js"></script>
        <script nomodule src="/build/rx-stencil.js"></script>

        <script type="text/javascript">
            let element = null;

            document.addEventListener("DOMContentLoaded", () => {
                element = document.querySelector("test-view-children-observable-emulation");
            });

            async function doUpdate() {
                let value = await element.getValue();
                console.log(value);
                
                element.show = true;
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                console.log(value);
            }
        </script>
    </head>


    <body>

        <button onclick="doUpdate()">Run</button>
        
        <test-view-children-observable-emulation>
            <test-view-children-observable-emulation pref="foo" />
        </test-view-children-observable-emulation>
    </body>
</html>
